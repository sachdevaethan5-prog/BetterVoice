[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "better-voice"
version = "0.1.1"
description = "Free, local voice dictation: hold a key, speak, and clean text is typed into any app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "transformers>=4.48",
    "soundfile>=0.12",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "qrcode>=7.4",  # the phone recorder's link as a scannable code
    "cryptography>=42",  # voice data encrypted at rest
    "keyring>=24",  # the key lives in the OS credential store
]

[project.optional-dependencies]
# Converting a trained model for the desktop app.
export = ["optimum-onnx>=0.1", "onnx>=1.16", "onnxruntime>=1.18"]

[project.scripts]
better-voice = "better_voice.app:main"
better-voice-record = "better_voice.record:main"
better-voice-train = "better_voice.train:main"
better-voice-export = "better_voice.export:main"

[tool.setuptools]
packages = ["better_voice"]

[tool.setuptools.package-data]
better_voice = ["data/*.txt", "data/*.html", "data/general/*"]
